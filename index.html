<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cacera PWA V3</title>

<link rel="manifest" href="manifest.json">

<style>

body{
 font-family:Arial,sans-serif;
 max-width:1200px;
 margin:auto;
 padding:20px;
 background:#f5f5f5;
}

.card{
 background:white;
 padding:15px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px;
}

.stat{
 background:white;
 padding:15px;
 border-radius:10px;
 text-align:center;
}

.verde{
 color:#2f6f3e;
}

.naranja{
 color:#cc7a00;
}

.azul{
 color:#2962a8;
}

button{
 padding:8px 12px;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

.btn{
 background:#2f6f3e;
 color:white;
}

.btnDelete{
 background:#d93025;
 color:white;
}

.btnEdit{
 background:#2962a8;
 color:white;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:8px;
 border-bottom:1px solid #ddd;
 text-align:left;
}

input,select{
 padding:8px;
}

textarea{
 width:100%;
 min-height:150px;
 margin-top:10px;
}

@media(max-width:700px){

 table{
  font-size:12px;
 }

}

</style>
</head>

<body>

<h1>🦌 Cacera PWA V3</h1>

<div class="stats">

<div class="stat">
<h3>Socios</h3>
<div id="totalSocios">0</div>
</div>

<div class="stat verde">
<h3>Vinc</h3>
<div id="totalVinc">0</div>
</div>

<div class="stat naranja">
<h3>No camina</h3>
<div id="totalNoCamina">0</div>
</div>

<div class="stat azul">
<h3>Gosser</h3>
<div id="totalGosser">0</div>
</div>

<div class="stat">
<h3>Vacantes</h3>
<div id="vacantes">0</div>
</div>

</div>

<div class="card">

<h2>Añadir socio</h2>

<input
id="nombre"
placeholder="Nombre">

<select id="tipo">

<option value="Vinc">
Vinc
</option>

<option value="No camina">
No camina
</option>

<option value="Gosser">
Gosser
</option>

</select>

<button
class="btn"
onclick="agregarSocio()">
Añadir
</button>

</div>

<div class="card">

<h2>Socios</h2>

<table>

<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Tipo</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>

</table>

</div>

<div class="card">

<button
class="btn"
onclick="exportarCSV()">
Exportar CSV
</button>

<button
class="btn"
onclick="crearWhatsApp()">
Resumen WhatsApp
</button>

<textarea id="salida"></textarea>

</div>
