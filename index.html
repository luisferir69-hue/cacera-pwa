<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cacera PWA</title>

<meta name="theme-color" content="#2f6f3e">

<link rel="manifest" href="manifest.json">

<style>

:root{
 --verde:#2f6f3e;
 --naranja:#c77d21;
 --azul:#2f5d99;
 --fondo:#f4f5f7;
 --panel:#ffffff;
 --texto:#222;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{
 background:var(--fondo);
 color:var(--texto);
 font-family:Arial,Helvetica,sans-serif;
 padding:15px;
}

.container{
 max-width:1400px;
 margin:auto;
}

h1{
 margin-bottom:10px;
}

.sub{
 color:#666;
 margin-bottom:20px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:12px;
 margin-bottom:20px;
}

.card{
 background:var(--panel);
 border-radius:12px;
 padding:15px;
 box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.cardLabel{
 font-size:12px;
 text-transform:uppercase;
 color:#666;
 margin-bottom:8px;
}

.cardValue{
 font-size:28px;
 font-weight:bold;
}

.panel{
 background:var(--panel);
 border-radius:12px;
 padding:15px;
 margin-bottom:20px;
 box-shadow:0 2px 5px rgba(0,0,0,.08);
}

h2{
 margin-bottom:15px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th{
 background:#efefef;
}

th,td{
 padding:10px;
 border-bottom:1px solid #ddd;
 text-align:left;
}

select,input{
 padding:8px;
 border:1px solid #ccc;
 border-radius:8px;
}

button{
 border:none;
 border-radius:8px;
 padding:10px 15px;
 cursor:pointer;
 margin-right:8px;
 font-weight:600;
}

.btnVerde{
 background:var(--verde);
 color:white;
}

.btnAzul{
 background:var(--azul);
 color:white;
}

.btnNaranja{
 background:var(--naranja);
 color:white;
}

.tag{
 color:white;
 padding:5px 10px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
}

.verde{
 background:var(--verde);
}

.naranja{
 background:var(--naranja);
}

.azul{
 background:var(--azul);
}

textarea{
 width:100%;
 margin-top:10px;
 min-height:140px;
 padding:10px;
 border-radius:8px<script>

const TOTAL_SOCIOS = 70;

const datosIniciales = [

{name:"Josep Maria Company",tipo:"Vinc"},
{name:"Enric Ranera",tipo:"Vinc"},
{name:"Poli",tipo:"Vinc"},
{name:"Cristian González",tipo:"Vinc"},
{name:"Jordi Mascort",tipo:"Vinc"},
{name:"Juan",tipo:"Vinc"},
{name:"Toni",tipo:"Vinc"},
{name:"Nico Molina",tipo:"Vinc"},
{name:"Felix Costa",tipo:"Vinc"},
{name:"Chavdar",tipo:"Vinc"},
{name:"Luis Cistella",tipo:"Vinc"},
{name:"Juan Antonio González",tipo:"Vinc"},
{name:"Vilaritg",tipo:"Vinc"},
{name:"Angel C. Cist.",tipo:"Vinc"},
{name:"Tú",tipo:"Vinc"},

{name:"Joan Parramon",tipo:"No camina"},
{name:"Carles Alegrí",tipo:"No camina"},
{name:"Josepmaria Dausa",tipo:"No camina"},
{name:"Pere Gauses",tipo:"No camina"},
{name:"Enric",tipo:"No camina"},

{name:"Albert Llosaire",tipo:"Gosser"},
{name:"Isi Perrero",tipo:"Gosser"},
{name:"Marc Perreo",tipo:"Gosser"},
{name:"Ariadna Garcia",tipo:"Gosser"},
{name:"Alberto",tipo:"Gosser"}

];

let socios =
JSON.parse(localStorage.getItem("caceraSocios"))
|| datosIniciales;

function guardar(){
 localStorage.setItem(
  "caceraSocios",
  JSON.stringify(socios)
 );
}

function render(){

 const tabla =
 document.getElementById("tablaSocios");

 tabla.innerHTML="";

 socios.forEach((s,index)=>{

  let color="verde";

  if(s.tipo==="No camina"){
   color="naranja";
  }

  if(s.tipo==="Gosser"){
   color="azul";
  }

  tabla.innerHTML += `
  <tr>
   <td>${index+1}</td>
   <td>${s.name}</td>
   <td>
    <span class="tag ${color}">
     ${s.tipo}
    </span>
   </td>
  </tr>`;
 });

 for(let i=socios.length+1;i<=70;i++){

  tabla.innerHTML += `
  <tr>
   <td>${i}</td>
   <td style="color:#999">
   [Vacante]
   </td>
   <td>-</td>
  </tr>`;
 }

 actualizarResumen();

 guardar();
}

function actualizarResumen(){

 const vinc =
 socios.filter(
  x=>x.tipo==="Vinc"
 ).length;

 const noCamina =
 socios.filter(
  x=>x.tipo==="No camina"
 ).length;

 const gosser =
 socios.filter(
  x=>x.tipo==="Gosser"
 ).length;

 const total =
 socios.length;

 document.getElementById(
 "vincTotal"
 ).textContent=vinc;

 document.getElementById(
 "nocaminaTotal"
 ).textContent=noCamina;

 document.getElementById(
 "gosserTotal"
 ).textContent=gosser;

 document.getElementById(
 "hanVotado"
 ).textContent=total;

 document.getElementById(
 "pendientes"
 ).textContent=
 TOTAL_SOCIOS-total;

 document.getElementById(
 "participacion"
 ).textContent=
 Math.round(
 (total/TOTAL_SOCIOS)*100
 ) + "%";

 document.getElementById(
 "barraVinc"
 ).style.width=
 ((vinc/total)*100)+"%";

 document.getElementById(
 "barraNoCamina"
 ).style.width=
 ((noCamina/total)*100)+"%";

 document.getElementById(
 "barraGosser"
 ).style.width=
 ((gosser/total)*100)+"%";
}

function anadirSocio(){

 const nombre =
 document.getElementById(
 "nuevoNombre"
 ).value.trim();

 const tipo =
 document.getElementById(
 "nuevoTipo"
 ).value;

 if(nombre===""){
  return;
 }

 if(socios.length>=70){

  alert(
  "Máximo 70 socios"
  );

  return;
 }

 socios.push({
  name:nombre,
  tipo:tipo
 });

 document.getElementById(
 "nuevoNombre"
 ).value="";

 render();
}

function exportarCSV(){

 let csv =
 "Numero;Nombre;Tipo\n";

 socios.forEach((s,i)=>{

  csv +=
  `${i+1};"${s.name}";"${s.tipo}"\n`;

 });

 csv += "\n";

 csv +=
 `TOTAL;${socios.length}\n`;

 const blob =
 new Blob(
  ["\uFEFF"+csv],
  {
   type:
   "text/csv;charset=utf-8;"
  }
 );

 const url =
 URL.createObjectURL(blob);

 const a =
 document.createElement("a");

 a.href=url;

 a.download =
 "Cacera.csv";

 a.click();

 URL.revokeObjectURL(url);
}

function generarWhatsApp(){

 const vinc =
 socios.filter(
 x=>x.tipo==="Vinc"
 ).length;

 const noCamina =
 socios.filter(
 x=>x.tipo==="No camina"
 ).length;

 const gosser =
 socios.filter(
 x=>x.tipo==="Gosser"
 ).length;

 const total =
 socios.length;

 document.getElementById(
 "salida"
 ).value =

`🦌 CACERA

🟢 Vinc: ${vinc}
🟠 No camina: ${noCamina}
🔵 Gosser: ${gosser}

👥 Confirmados: ${total}
⏳ Pendientes: ${TOTAL_SOCIOS-total}

📈 Participación:
${Math.round((total/TOTAL_SOCIOS)*100)}%
`;

}

if("serviceWorker" in navigator){

 window.addEventListener(
 "load",
 ()=>{

  navigator.serviceWorker
  .register("./sw.js");

 });

}

render();

</script>

</div>

</body>
</html>
