<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cacera PWA</title>

<link rel="manifest" href="manifest.json">

<style>
body{
 font-family:Arial,sans-serif;
 max-width:1000px;
 margin:auto;
 padding:20px;
 background:#f5f5f5;
}

.card{
 background:white;
 padding:15px;
 border-radius:10px;
 margin-bottom:15px;
 box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h1{
 color:#2f6f3e;
}

button{
 padding:10px;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

.btn{
 background:#2f6f3e;
 color:white;
}

table{
 width:100%;
 border-collapse:collapse;
}

td,th{
 padding:8px;
 border-bottom:1px solid #ddd;
 text-align:left;
}

input{
 padding:8px;
 width:250px;
}

textarea{
 width:100%;
 height:150px;
}
</style>

</head>
<body>

<h1>🦌 Cacera PWA</h1>

<div class="card">

<p><b>Socios máximos:</b> 60</p>

<p>
<b>Confirmados:</b>
<span id="confirmados">0</span>
</p>

<p>
<b>Vacantes:</b>
<span id="vacantes">60</span>
</p>

</div>

<div class="card">

<h2>Añadir socio</h2>

<input
id="nombre"
placeholder="Nombre del socio">

<button
class="btn"
onclick="agregar()">
Añadir
</button>

</div>

<div class="card">

<h2>Listado</h2>

<table>

<thead>
<tr>
<th>#</th>
<th>Nombre</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<div class="card">

<button
class="btn"
onclick="exportarCSV()">
Exportar CSV
</button>

<button
class="btn"
onclick="resumenWhatsApp()">
WhatsApp
</button>

<textarea
id="salida">
</textarea>

</div>

<script>

const MAX_SOCIOS = 60;

const iniciales = [

"Josep Maria Company",
"Enric Ranera",
"Poli",
"Cristian González",
"Jordi Mascort",
"Juan",
"Toni",
"Nico Molina",
"Felix Costa",
"Chavdar",
"Luis Cistella",
"Juan Antonio González",
"Vilaritg",
"Angel C. Cist.",
"Joan Parramon",
"Carles Alegrí",
"Josepmaria Dausa",
"Pere Gauses",
"Enric",
"Albert Llosaire",
"Isi Perrero",
"Marc Perreo",
"Ariadna Garcia",
"Alberto"

];

let socios =
JSON.parse(
localStorage.getItem("socios")
) || iniciales;

function guardar(){

 localStorage.setItem(
 "socios",
 JSON.stringify(socios)
 );

}

function render(){

 const tabla =
 document.getElementById("tabla");

 tabla.innerHTML="";

 socios.forEach((nombre,i)=>{

  tabla.innerHTML+=`
  <tr>
  <td>${i+1}</td>
  <td>${nombre}</td>
  </tr>
  `;

 });

 for(
  let i=socios.length+1;
  i<=MAX_SOCIOS;
  i++
 ){

  tabla.innerHTML+=`
  <tr>
  <td>${i}</td>
  <td style="color:gray">
  [VACANTE]
  </td>
  </tr>
  `;

 }

 document
 .getElementById("confirmados")
 .textContent=socios.length;

 document
 .getElementById("vacantes")
 .textContent=
 MAX_SOCIOS-socios.length;

 guardar();

}

function agregar(){

 const nombre =
 document.getElementById(
 "nombre"
 ).value.trim();

 if(!nombre){
  return;
 }

 if(
 socios.length>=MAX_SOCIOS
 ){
  alert(
  "Límite alcanzado"
  );
  return;
 }

 socios.push(nombre);

 document
 .getElementById("nombre")
 .value="";

 render();

}

function exportarCSV(){

 let csv="Numero;Nombre\n";

 socios.forEach((s,i)=>{

  csv+=`${i+1};${s}\n`;

 });

 const blob =
 new Blob(
 [csv],
 {type:"text/csv"}
 );

 const url =
 URL.createObjectURL(blob);

 const a =
 document.createElement("a");

 a.href=url;

 a.download="socios.csv";

 a.click();

}

function resumenWhatsApp(){

 document
 .getElementById("salida")
 .value =

`🦌 CACERA

Confirmados: ${socios.length}

Vacantes:
${MAX_SOCIOS-socios.length}
`;

}

render();

if(
 "serviceWorker"
 in navigator
){

 navigator.serviceWorker
 .register("./sw.js");

}

</script>

</body>
</html>
