<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cacera PWA V3</title>

<link rel="manifest" href="manifest.json">

<style>

body{
 font-family:Arial,sans-serif;
 max-width:1200px;
 margin:auto;
 padding:20px;
 background:#f5f5f5;
}

.card{
 background:white;
 padding:15px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.stats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px;
}

.stat{
 background:white;
 padding:15px;
 border-radius:10px;
 text-align:center;
}

.verde{
 color:#2f6f3e;
}

.naranja{
 color:#cc7a00;
}

.azul{
 color:#2962a8;
}

button{
 padding:8px 12px;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

.btn{
 background:#2f6f3e;
 color:white;
}

.btnDelete{
 background:#d93025;
 color:white;
}

.btnEdit{
 background:#2962a8;
 color:white;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:8px;
 border-bottom:1px solid #ddd;
 text-align:left;
}

input,select{
 padding:8px;
}

textarea{
 width:100%;
 min-height:150px;
 margin-top:10px;
}

@media(max-width:700px){

 table{
  font-size:12px;
 }

}

</style>
</head>

<body>

<h1>🦌 Cacera PWA V3</h1>

<div class="stats">

<div class="stat">
<h3>Socios</h3>
<div id="totalSocios">0</div>
</div>

<div class="stat verde">
<h3>Vinc</h3>
<div id="totalVinc">0</div>
</div>

<div class="stat naranja">
<h3>No camina</h3>
<div id="totalNoCamina">0</div>
</div>

<div class="stat azul">
<h3>Gosser</h3>
<div id="totalGosser">0</div>
</div>

<div class="stat">
<h3>Vacantes</h3>
<div id="vacantes">0</div>
</div>

</div>

<div class="card">

<h2>Añadir socio</h2>

<input
id="nombre"
placeholder="Nombre">

<select id="tipo">

<option value="Vinc">
Vinc
</option>

<option value="No camina">
No camina
</option>

<option value="Gosser">
Gosser
</option>

</select>

<button
class="btn"
onclick="agregarSocio()">
Añadir
</button>

</div>

<div class="card">

<h2>Socios</h2>

<table>

<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Tipo</th>
<th>Acciones</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>

</table>

</div>

<div class="card">

<button
class="btn"
onclick="exportarCSV()">
Exportar CSV
</button>

<button
class="btn"
onclick="crearWhatsApp()">
Resumen WhatsApp
</button>

<textarea id="salida"></textarea>

</div>
<script>

const MAX_SOCIOS = 60;

const sociosIniciales = [

{nombre:"Josep Maria Company",tipo:"Vinc"},
{nombre:"Enric Ranera",tipo:"Vinc"},
{nombre:"Poli",tipo:"Vinc"},
{nombre:"Cristian González",tipo:"Vinc"},
{nombre:"Jordi Mascort",tipo:"Vinc"},
{nombre:"Juan",tipo:"Vinc"},
{nombre:"Toni",tipo:"Vinc"},
{nombre:"Nico Molina",tipo:"Vinc"},
{nombre:"Felix Costa",tipo:"Vinc"},
{nombre:"Chavdar",tipo:"Vinc"},
{nombre:"Luis Cistella",tipo:"Vinc"},
{nombre:"Juan Antonio González",tipo:"Vinc"},
{nombre:"Vilaritg",tipo:"Vinc"},
{nombre:"Angel C. Cist.",tipo:"Vinc"},
{nombre:"Tú",tipo:"Vinc"},

{nombre:"Joan Parramon",tipo:"No camina"},
{nombre:"Carles Alegrí",tipo:"No camina"},
{nombre:"Josepmaria Dausa",tipo:"No camina"},
{nombre:"Pere Gauses",tipo:"No camina"},
{nombre:"Enric",tipo:"No camina"},

{nombre:"Albert Llosaire",tipo:"Gosser"},
{nombre:"Isi Perrero",tipo:"Gosser"},
{nombre:"Marc Perreo",tipo:"Gosser"},
{nombre:"Ariadna Garcia",tipo:"Gosser"},
{nombre:"Alberto",tipo:"Gosser"}

];

let socios =
JSON.parse(
localStorage.getItem("cacera-v3")
) || sociosIniciales;

function guardar(){

 localStorage.setItem(
  "cacera-v3",
  JSON.stringify(socios)
 );

}

function render(){
const textoBusqueda =
(document.getElementById("buscar")?.value || "")
.toLowerCase();

const filtro =
(document.getElementById("filtro")?.value || "Todos");
 const tabla =
 document.getElementById("tabla");

 tabla.innerHTML="";

 socios.forEach((socio,index)=>{

 if(
  textoBusqueda &&
  !socio.nombre
   .toLowerCase()
   .includes(textoBusqueda)
 ){
  return;
 }

 if(
  filtro !== "Todos" &&
  socio.tipo !== filtro
 ){
  return;
 }

 let color="#2f6f3e";

 if(socio.tipo==="No camina"){
  color="#cc7a00";
 }

 if(socio.tipo==="Gosser"){
  color="#2962a8";
 }

 tabla.innerHTML += `
 <tr>

 <td>${index+1}</td>

 <td>${socio.nombre}</td>

 <td>
  <span style="
  color:${color};
  font-weight:bold;">
  ${socio.tipo}
  </span>
 </td>

 <td>

 <button
 class="btnEdit"
 onclick="editar(${index})">
 ✏️
 </button>

 <button
 class="btnDelete"
 onclick="eliminar(${index})">
 🗑️
 </button>

 </td>

 </tr>
 `;

 });

 actualizarStats();

 guardar();
}

function actualizarStats(){

 const vinc =
 socios.filter(
 s=>s.tipo==="Vinc"
 ).length;

 const noCamina =
 socios.filter(
 s=>s.tipo==="No camina"
 ).length;

 const gosser =
 socios.filter(
 s=>s.tipo==="Gosser"
 ).length;

 document.getElementById(
 "totalSocios"
 ).textContent =
 socios.length;

 document.getElementById(
 "totalVinc"
 ).textContent =
 vinc;

 document.getElementById(
 "totalNoCamina"
 ).textContent =
 noCamina;

 document.getElementById(
 "totalGosser"
 ).textContent =
 gosser;

 document.getElementById(
 "vacantes"
 ).textContent =
 MAX_SOCIOS - socios.length;

}

function agregarSocio(){

 const nombre =
 document.getElementById(
 "nombre"
 ).value.trim();

 const tipo =
 document.getElementById(
 "tipo"
 ).value;

 if(!nombre){

  alert(
  "Introduce un nombre"
  );

  return;
 }

 if(
 socios.length>=MAX_SOCIOS
 ){

  alert(
  "Máximo 60 socios"
  );

  return;
 }

 socios.push({

  nombre:nombre,
  tipo:tipo

 });

 document.getElementById(
 "nombre"
 ).value="";

 render();
}

function eliminar(id){

 if(
 !confirm(
 "¿Eliminar socio?"
 )
 ){
  return;
 }

 socios.splice(id,1);

 render();
}

function editar(id){

 const nuevoNombre =
 prompt(
 "Nombre:",
 socios[id].nombre
 );

 if(
 nuevoNombre===null
 ){
  return;
 }

 const nuevoTipo =
 prompt(
 "Tipo (Vinc, No camina o Gosser):",
 socios[id].tipo
 );

 if(
 nuevoTipo===null
 ){
  return;
 }

 socios[id].nombre =
 nuevoNombre;

 socios[id].tipo =
 nuevoTipo;

 render();
}

function exportarCSV(){

 let csv =
 "Numero;Nombre;Tipo\n";

 socios.forEach((s,i)=>{

 csv +=
 `${i+1};${s.nombre};${s.tipo}\n`;

 });

 const blob =
 new Blob(
 [csv],
 {type:"text/csv"}
 );

 const url =
 URL.createObjectURL(
 blob
 );

 const a =
 document.createElement("a");

 a.href=url;

 a.download=
 "cacera.csv";

 a.click();
}

function crearWhatsApp(){

 const vinc =
 socios.filter(
 s=>s.tipo==="Vinc"
 ).length;

 const noCamina =
 socios.filter(
 s=>s.tipo==="No camina"
 ).length;

 const gosser =
 socios.filter(
 s=>s.tipo==="Gosser"
 ).length;

 const texto =

`🦌 CACERA

🟢 Vinc: ${vinc}
🟠 No camina: ${noCamina}
🔵 Gosser: ${gosser}

👥 Confirmados:
${socios.length}

⏳ Vacantes:
${MAX_SOCIOS-socios.length}
`;

 document.getElementById(
 "salida"
 ).value =
 texto;

 navigator.clipboard
 .writeText(texto)
 .catch(()=>{});
}
function generarInforme(){

 const vinc =
 socios.filter(
  x=>x.tipo==="Vinc"
 );

 const noCamina =
 socios.filter(
  x=>x.tipo==="No camina"
 );

 const gosser =
 socios.filter(
  x=>x.tipo==="Gosser"
 );

 const ventana =
 window.open("","_blank");

 ventana.document.write(`

 <html>

 <head>

 <title>Informe Cacera</title>

 <style>

 body{
  font-family:Arial,sans-serif;
  padding:20px;
 }

 .cards{
  display:grid;
  grid-template-columns:
  repeat(6,1fr);
  gap:10px;
 }

 .card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px;
 }

 table{
  width:100%;
  border-collapse:collapse;
 }

 th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
 }

 </style>

 </head>

 <body>

 <h1>
 🦌 Cacera - 29/11/2026
 </h1>

 <div class="cards">

 <div class="card">
 Confirmados<br>
 <b>${socios.length}</b>
 </div>

 <div class="card">
 Vacantes<br>
 <b>${MAX_SOCIOS-socios.length}</b>
 </div>

 <div class="card">
 Vinc<br>
 <b>${vinc.length}</b>
 </div>

 <div class="card">
 No camina<br>
 <b>${noCamina.length}</b>
 </div>

 <div class="card">
 Gosser<br>
 <b>${gosser.length}</b>
 </div>

 <div class="card">
 Participación<br>
 <b>${Math.round((socios.length/MAX_SOCIOS)*100)}%</b>
 </div>

 </div>

 <br>

 <table>

 <tr>
 <th>#</th>
 <th>Nombre</th>
 <th>Tipo</th>
 </tr>

 ${socios.map((s,i)=>`

 <tr>

 <td>${i+1}</td>

 <td>${s.nombre}</td>

 <td>${s.tipo}</td>

 </tr>

 `).join("")}

 </table>

 </body>

 </html>

 `);

 ventana.document.close();

 ventana.print();

}
if(
 "serviceWorker"
 in navigator
){

 navigator.serviceWorker
 .register("./sw.js");

}

render();

</script>

</body>
</html>
